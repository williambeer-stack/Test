name: Scrape Sydney basketball stats

on:
  schedule:
    - cron: '17 18 * * *' # daily, ~4-5am Sydney time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hoops-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hoops/scraper/package-lock.json
      - name: Install scraper
        working-directory: hoops/scraper
        run: npm ci
      - name: Test scraper
        working-directory: hoops/scraper
        run: npm test
      - name: Scrape
        working-directory: hoops/scraper
        run: npm run scrape
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hoops/data/players.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Sydney basketball stats"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hoops

  deploy:
    # Needs Settings -> Pages -> Source set to "GitHub Actions". Skipped quietly if it isn't.
    needs: scrape
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
