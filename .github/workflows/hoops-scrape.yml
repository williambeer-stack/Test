name: Scrape Sydney basketball stats

on:
  schedule:
    - cron: '17 18 * * *' # daily, ~4-5am Sydney time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hoops-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hoops/scraper/package-lock.json
      # Box-score and per-source caches carry over between runs, so after the first
      # (full history) run each scrape only fetches what changed.
      - name: Restore scrape cache
        uses: actions/cache/restore@v4
        with:
          path: hoops/data/cache
          key: hoops-cache-${{ github.run_id }}
          restore-keys: hoops-cache-
      - name: Install scraper
        working-directory: hoops/scraper
        run: npm ci
      - name: Test scraper
        working-directory: hoops/scraper
        run: npm test
      - name: Scrape
        working-directory: hoops/scraper
        run: npm run scrape
      - name: Save scrape cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hoops/data/cache
          key: hoops-cache-${{ github.run_id }}
      - name: Leave caches out of the published site
        run: rm -rf hoops/data/cache hoops/scraper
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hoops

  deploy:
    # Needs Settings -> Pages -> Source set to "GitHub Actions".
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
